<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLVS — Shop & Track</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f4;--border:#e7e1d5;--text:#1c1a17;--muted:#8a8378;--accent:#cb352e;--accent2:#a32a24;--ok:#3f7d4e}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(460px 320px at 15% 10%,rgba(203,53,46,.10),transparent 70%),radial-gradient(520px 380px at 85% 40%,rgba(203,53,46,.07),transparent 70%),var(--bg)}
.flvslogo{font-weight:800;font-style:italic;letter-spacing:-.05em;line-height:1;display:inline-flex;align-items:baseline;color:#1c1a17}
.flvslogo .co{font-style:normal;font-weight:800;font-size:.24em;background:#1c1a17;color:#fff;border-radius:999px;padding:.5em .55em;margin-left:.22em;transform:translateY(.05em)}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 24px}
.pill{background:rgba(255,255,255,.7);border:1px solid var(--border);border-radius:999px;padding:7px 16px;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--accent);cursor:pointer;text-decoration:none}
main{max-width:1000px;margin:0 auto;padding:10px 22px 40px}
h1{font-weight:800;font-size:clamp(34px,6vw,58px);letter-spacing:-.04em;text-align:center;margin:20px 0 4px}
h1 em{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;color:var(--accent)}
.sub{color:var(--muted);font-size:14px;text-align:center;max-width:560px;margin:0 auto 26px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.prod{background:rgba(255,255,255,.55);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.8);border-radius:22px;overflow:hidden;box-shadow:0 8px 28px rgba(28,26,23,.06)}
.prod .ph{height:150px;display:flex;align-items:center;justify-content:center;font-size:44px;background:linear-gradient(135deg,#cb352e18,#b07d2a12)}
.prod .body{padding:14px 16px 16px}
.prod h3{font-size:14px;font-weight:700}
.prod .price{color:var(--accent);font-weight:800;margin:4px 0 10px}
.prod .oos{color:var(--muted);font-size:12px;font-style:italic}
.btn{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:999px;font-weight:700;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer}
.btn:hover{background:var(--accent2)}
.btn.secondary{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn.small{padding:6px 12px;font-size:10px}
.panel{background:rgba(255,255,255,.55);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.8);border-radius:22px;padding:20px;margin:20px 0;box-shadow:0 8px 28px rgba(28,26,23,.06)}
input,select{background:#fff;border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;width:100%}
label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);display:block;margin-bottom:4px}
.field{margin-bottom:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cartbar{position:fixed;bottom:0;left:0;right:0;background:#1c1a17;color:#fff;display:none;justify-content:space-between;align-items:center;padding:14px 22px;z-index:40}
.cartbar.show{display:flex}
.modal-bg{position:fixed;inset:0;background:rgba(28,26,23,.45);display:none;align-items:center;justify-content:center;z-index:80;padding:18px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:22px;padding:24px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(28,26,23,.3)}
.modal h3{font-family:'Cormorant Garamond',serif;font-size:26px;margin-bottom:4px}
.steps{display:flex;flex-direction:column;gap:0;margin:14px 0}
.step{display:flex;gap:12px}
.step .dot{width:14px;height:14px;border-radius:50%;background:var(--border);margin-top:2px;flex-shrink:0}
.step.done .dot{background:var(--ok)}
.step.cur .dot{background:var(--accent);box-shadow:0 0 0 4px #cb352e22}
.step .line{width:2px;flex:1;background:var(--border);margin:2px auto}
.step-wrap{display:flex;flex-direction:column;align-items:center}
.step .txt{padding-bottom:18px;font-size:13px}
.step .txt b{display:block}
.step .txt span{color:var(--muted);font-size:12px}
.toast{position:fixed;bottom:80px;right:20px;max-width:400px;background:#fff;border:1px solid var(--accent);padding:14px 18px;border-radius:12px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:99;box-shadow:0 8px 24px rgba(28,26,23,.15)}
.toast.show{opacity:1}
/* chat bubble */
#chatFab{position:fixed;right:20px;bottom:76px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:22px;cursor:pointer;box-shadow:0 10px 26px rgba(203,53,46,.4);z-index:45}
#chatBox{position:fixed;right:20px;bottom:140px;width:320px;max-width:92vw;background:#fff;border-radius:18px;box-shadow:0 20px 50px rgba(28,26,23,.25);display:none;flex-direction:column;overflow:hidden;z-index:46}
#chatBox.show{display:flex}
#chatHead{background:#1c1a17;color:#fff;padding:12px 16px;font-size:13px;font-weight:600}
#chatLog{height:240px;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.msg{max-width:82%;padding:8px 12px;border-radius:12px;font-size:13px;line-height:1.4}
.msg.u{align-self:flex-end;background:var(--accent);color:#fff}
.msg.b{align-self:flex-start;background:#fff;border:1px solid var(--border)}
#chatIn{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border)}
#chatIn input{flex:1}
.tabs{display:flex;gap:2px;margin:0 auto 20px;padding:5px;background:#1c1a17;border-radius:999px;width:max-content}
.tabs button{background:none;border:none;border-radius:999px;color:#cfc8bb;padding:8px 18px;font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer}
.tabs button.active{background:var(--bg);color:#1c1a17}
</style>
</head>
<body>
<header>
  <div style="display:flex;gap:10px;align-items:baseline">
    <span id="brandLogo" style="font-weight:800;font-style:italic;letter-spacing:-.04em;font-size:26px">flvs.</span>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <span class="pill" id="brandSwitch" onclick="switchBrand()" style="cursor:pointer">⇄ demo: view another brand's store</span>
    <a class="pill" href="flvs-bran-landing.html">● powered by flvs.bran</a>
  </div>
</header>
<main>
  <h1 id="brandH1">Buy her <em>FLVS.</em></h1>
  <p class="sub" id="brandTag">Handmade swimwear from Trinidad & Tobago 🇹🇹 — order below, pay online or cash on delivery, and track your piece to your door.</p>

  <div class="tabs">
    <button class="active" onclick="showT('shop',this)">Shop the drop</button>
    <button onclick="showT('track',this)">Track my order</button>
  </div>

  <section id="shop">
    <div class="grid" id="prodGrid"></div>
  </section>

  <section id="track" style="display:none">
    <div class="panel" style="max-width:560px;margin:0 auto">
      <label>Tracking code (from your confirmation DM)</label>
      <div style="display:flex;gap:10px;margin-top:4px">
        <input id="trackIn" placeholder="e.g. OD-7X9K2M4P">
        <button class="btn" onclick="track()">Track</button>
      </div>
      <div id="trackOut" style="margin-top:18px"></div>
    </div>
  </section>
</main>

<div class="cartbar" id="cartbar">
  <span id="cartTxt" style="font-size:14px"></span>
  <button class="btn" style="background:#fff;color:var(--accent)" onclick="checkout()">Checkout →</button>
</div>

<button id="chatFab" onclick="document.getElementById('chatBox').classList.toggle('show')">💬</button>
<div id="chatBox">
  <div id="chatHead">FLVS — usually replies in seconds ⚡</div>
  <div id="chatLog"></div>
  <div id="chatIn"><input id="chatMsg" placeholder="Ask about stock, size, delivery…" onkeydown="if(event.key==='Enter')sendChat()"><button class="btn small" onclick="sendChat()">Send</button></div>
</div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
/* Each subscribed brand gets this same template, skinned from their backoffice:
   name, tagline, brand color, catalog, pickup point, and their bot's trained voice.
   Live URLs would be shop.flvs.bran/{handle} or the brand's own domain. */
const BRANDS={
 flvs:{
  handle:'flvs',logo:'flvs.',accent:'#cb352e',cur:'TT$',
  payments:['Card / payment link','Cash on delivery'],manual:false,
  h1:'Buy her <em>FLVS.</em>',
  tagline:'Handmade swimwear from Trinidad & Tobago 🇹🇹 — order below, pay online or cash on delivery, and track your piece to your door.',
  chatHead:'FLVS — usually replies in seconds ⚡',
  greeting:'Wah gwan! 👋 FLVS bot here. Ask mi bout stock, sizes, or yuh delivery.',
  pickup:'the FLVS studio',
  catalog:[
   {id:1,name:'DBL.BLK Steam Mono II',price:600,stock:8,icon:'🖤'},
   {id:2,name:'miniKINI',price:300,stock:5,icon:'👙'},
   {id:3,name:'Flame Tringl Kini',price:300,stock:12,icon:'🔥'},
   {id:4,name:'Brazil Kini',price:280,stock:30,icon:'💛'},
   {id:5,name:'Camo Tringl Kini',price:300,stock:38,icon:'🌿'},
   {id:6,name:'RUBI-WHTE Steam Mono LTD',price:500,stock:0,icon:'🤍'}
  ]},
 wiredbras:{
  handle:'wiredbras',logo:'WIRED BRAS TT',accent:'#7a3fa0',cur:'TT$',
  h1:'Support looks <em>this good.</em>',
  tagline:'Wired Bras TT 🇹🇹 — fitted bras and shapewear, made for we body. Order below, pay online or cash on delivery, and track it to your door.',
  chatHead:'Wired Bras TT — quick replies 💜',
  greeting:'Hey love! 💜 Wired Bras bot here — ask mi bout sizes, fittings, or yuh delivery.',
  pickup:'the Wired Bras fitting room',
  payments:['Card / payment link','Cash on delivery'],manual:false,
  catalog:[
   {id:1,name:'Everyday T-Shirt Bra',price:180,stock:22,icon:'🩱'},
   {id:2,name:'Full-Support Wired Bra',price:220,stock:9,icon:'💜'},
   {id:3,name:'Strapless Carnival Bra',price:260,stock:4,icon:'✨'},
   {id:4,name:'Shapewear Bodysuit',price:320,stock:15,icon:'🖤'},
   {id:5,name:'Lace Bralette',price:150,stock:0,icon:'🌸'}
  ]},
 ekothreads:{
  handle:'ekothreads',logo:'ÈKÓ THREADS',accent:'#1f7a4d',cur:'₦',
  h1:'Lagos on your <em>back.</em>',
  tagline:'Èkó Threads 🇳🇬 — Lagos streetwear, worldwide energy. Order below, pay by transfer or Paystack, and follow your piece to your door.',
  chatHead:'Èkó Threads — replies sharp sharp ⚡',
  greeting:'How far! 🇳🇬 Èkó bot here — ask me about sizes, prices, or your delivery.',
  pickup:'the Èkó Threads studio, Surulere',
  payments:['Paystack / card link','Bank transfer'],manual:true,
  catalog:[
   {id:1,name:'Danfo Yellow Tee',price:15000,stock:18,icon:'🚌'},
   {id:2,name:'Èkó Heavyweight Hoodie',price:38000,stock:6,icon:'🧥'},
   {id:3,name:'Owambe Two-Piece',price:45000,stock:11,icon:'✨'},
   {id:4,name:'No Wahala Cap',price:9500,stock:30,icon:'🧢'},
   {id:5,name:'Third Mainland Longsleeve',price:22000,stock:0,icon:'🌉'}
  ]}
};
const params=new URLSearchParams(location.search);
const BRAND=BRANDS[params.get('brand')]||BRANDS.flvs;
const CATALOG=BRAND.catalog;
/* skin the page */
document.title=BRAND.logo+' — Shop & Track';
document.documentElement.style.setProperty('--accent',BRAND.accent);
document.documentElement.style.setProperty('--accent2',BRAND.accent+'cc');
document.getElementById('brandLogo').textContent=BRAND.logo;
document.getElementById('brandH1').innerHTML=BRAND.h1;
document.getElementById('brandTag').textContent=BRAND.tagline;
document.getElementById('chatHead').textContent=BRAND.chatHead;
function switchBrand(){const keys=Object.keys(BRANDS);const next=keys[(keys.indexOf(BRAND.handle)+1)%keys.length];location.search='?brand='+next}
let cart=[],orders={};
try{orders=JSON.parse(localStorage.getItem('flvsshop_'+BRAND.handle)||'{}')}catch(e){}
function save(){try{localStorage.setItem('flvsshop_'+BRAND.handle,JSON.stringify(orders))}catch(e){}}
function toast(m){const t=document.getElementById('toast');t.innerHTML=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),3200)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function modal(h){document.getElementById('modalBox').innerHTML=h;document.getElementById('modalBg').classList.add('show')}
function closeModal(){document.getElementById('modalBg').classList.remove('show')}
function showT(id,btn){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
 document.getElementById('shop').style.display=id==='shop'?'block':'none';
 document.getElementById('track').style.display=id==='track'?'block':'none'}
const CUR=BRAND.cur;
function renderShop(){
 document.getElementById('prodGrid').innerHTML=CATALOG.map(p=>`
  <div class="prod"><div class="ph">${p.img?`<img src="${p.img}" style="width:100%;height:100%;object-fit:cover">`:p.icon}</div><div class="body">
   <h3>${p.name}</h3><div class="price">${CUR}${p.price.toLocaleString()}</div>
   ${p.stock>0?`<button class="btn small" onclick="addCart(${p.id})">Add to order</button> <span style="font-size:11px;color:var(--muted)">${p.stock<7?p.stock+' left!':''}</span>`
    :'<div class="oos">Sold out — DM us to get pinged on restock</div>'}
  </div></div>`).join('');
}
function addCart(id){const p=CATALOG.find(x=>x.id===id);cart.push(p);renderCart();toast(esc(p.name)+' added 🛒')}
function renderCart(){
 const bar=document.getElementById('cartbar');
 bar.classList.toggle('show',cart.length>0);
 if(cart.length)document.getElementById('cartTxt').innerHTML=`🛒 ${cart.length} item${cart.length>1?'s':''} · ${CUR}${cart.reduce((a,p)=>a+p.price,0).toLocaleString()}`;
}
function checkout(){
 const tot=cart.reduce((a,p)=>a+p.price,0);
 modal(`<h3>Checkout</h3><p style="color:var(--muted);font-size:13px;margin-bottom:12px">${cart.map(p=>esc(p.name)).join(' · ')} — <b>${CUR}${tot.toLocaleString()}</b></p>
  <div class="row2"><div class="field"><label>Name</label><input id="cName" placeholder="Your name"></div>
  <div class="field"><label>Phone</label><input id="cPhone" placeholder="${BRAND.manual?'+234…':'18685551234'}"></div></div>
  <div class="field"><label>Delivery address</label><input id="cAddr" placeholder="Street, area"></div>
  <div class="field"><label>📍 Drop your pin</label><button class="btn small secondary" onclick="this.textContent='✓ Location pinned';toast('Map pin captured — helps the ${BRAND.manual?'rider':'courier'} find unnumbered addresses.')">Pin my location on the map</button></div>
  <div class="row2">
   <div class="field"><label>Delivery speed</label><select id="cSvc">${BRAND.manual?'<option>Standard delivery</option><option>Express (where available)</option>':'<option>Standard (1-2 days) — TT$38</option><option>Instant (same-day) — TT$45</option>'}</select></div>
   <div class="field"><label>Payment</label><select id="cPay">${BRAND.payments.map(p=>`<option>${p}</option>`).join('')}</select></div>
  </div>
  <button class="btn" style="width:100%" onclick="placeOrder(${tot})">Place order</button>`);
}
function placeOrder(tot){
 const name=document.getElementById('cName').value.trim()||'Customer';
 const track=(BRAND.manual?'TRK-':'OD-')+Math.random().toString(36).slice(2,10).toUpperCase();
 const pay=document.getElementById('cPay').value;
 const cod=pay.includes('Cash');
 orders[track]={name,items:cart.map(p=>p.name),tot,cod,pay,placed:Date.now(),status:1};
 save();cart=[];renderCart();closeModal();
 modal(`<h3>Order confirmed 🎉</h3>
  <p style="font-size:14px;line-height:1.7;margin:10px 0">Thanks ${esc(name)}! ${cod?'Have <b>'+CUR+tot.toLocaleString()+'</b> ready — collected on delivery.':pay.includes('transfer')?'Transfer details have been DM\'d to you — your order ships once payment lands.':'A payment link has been sent to your phone.'}<br><br>
  Your tracking code:<br><b style="font-size:22px;color:var(--accent)">${track}</b><br>
  <span style="color:var(--muted);font-size:12px">We also DM'd it to you. ${BRAND.manual?BRAND.logo+' updates every step on your tracking page — same link the whole way.':'The courier picks up from '+BRAND.pickup+' and you\'ll get updates at every step.'}</span></p>
  <button class="btn" style="width:100%" onclick="closeModal();prefillTrack('${track}')">Track it now →</button>`);
}
function prefillTrack(code){document.querySelectorAll('.tabs button')[1].click();document.getElementById('trackIn').value=code;track()}
const STAGES=BRAND.manual?[
 {t:'Order received',s:BRAND.logo+' is packing your order'},
 {t:'Packed',s:'Boxed up and ready — updated by '+BRAND.logo},
 {t:'Shipped',s:'On its way with the delivery rider'},
 {t:'Out for delivery',s:'Almost with you'},
 {t:'Delivered',s:'Enjoy! Tag the brand in your fit!'}
]:[
 {t:'Order received',s:BRAND.logo+' is packing your order'},
 {t:'Courier booked',s:'Pickup scheduled at '+BRAND.pickup},
 {t:'Picked up',s:'Your package is with the courier'},
 {t:'Out for delivery',s:'On the road to you — have your PIN ready'},
 {t:'Delivered',s:'Enjoy! 🇹🇹 Tag the brand in your fit!'}
];
function track(){
 const code=document.getElementById('trackIn').value.trim().toUpperCase();
 const out=document.getElementById('trackOut');
 if(!code){out.innerHTML='';return}
 let o=orders[code];
 if(!o&&!/^(OD|TRK)-/.test(code)){out.innerHTML='<p style="color:var(--muted);font-size:13px">Codes look like <b>'+(BRAND.manual?'TRK':'OD')+'-XXXXXXXX</b> — check your confirmation DM.</p>';return}
 if(!o){o={name:'Demo',items:[CATALOG[0].name],tot:CATALOG[0].price,cod:false,placed:Date.now()-1000*60*60*20,status:3}}
 else{const hrs=(Date.now()-o.placed)/36e5;o.status=Math.min(4,1+Math.floor(hrs*8));} // progresses over time in demo
 out.innerHTML=`<div style="font-size:13px;color:var(--muted);margin-bottom:12px">${esc(code)} · ${o.items.map(esc).join(', ')} · ${CUR}${o.tot.toLocaleString()}${o.cod?' · <b>cash on delivery</b>':''}</div>
  <div class="steps">${STAGES.map((st,i)=>`
   <div class="step ${i<o.status?'done':i===o.status?'cur':''}">
    <div class="step-wrap"><div class="dot"></div>${i<STAGES.length-1?'<div class="line"></div>':''}</div>
    <div class="txt"><b>${st.t}</b><span>${st.s}</span></div>
   </div>`).join('')}</div>
  ${o.status>=4?'<p style="color:var(--ok);font-weight:700;font-size:14px">Delivered ✓</p>':`<p style="color:var(--muted);font-size:12px">${BRAND.manual?'Statuses are updated live by '+BRAND.logo+' from their backoffice.':'This page updates automatically — no need to refresh.'}</p>`}`;
}
/* mini bot */
function addB(w,t){const l=document.getElementById('chatLog');l.innerHTML+=`<div class="msg ${w}">${t}</div>`;l.scrollTop=l.scrollHeight}
const REPLIES=[
 {k:['price','much','cost'],f:()=>{const c=[...CATALOG].sort((a,b)=>a.price-b.price);return `Prices run ${CUR}${c[0].price.toLocaleString()} (${c[0].name}) up to ${CUR}${c[c.length-1].price.toLocaleString()} (${c[c.length-1].name}) — everything on the page below!`}},
 {k:['stock','left','available'],f:()=>{const p=CATALOG.filter(p=>p.stock>0&&p.stock<7);return p.length?`Low stock alert: ${p.map(x=>x.name+' ('+x.stock+' left)').join(', ')} — don't sleep on it!`:'Everything on the page in stock!'}},
 {k:['ship','deliver','reach','track'],f:()=>BRAND.manual?`We deliver nationwide 🚚 ${BRAND.logo} updates your tracking page at every step — code starts with TRK-, use the Track tab!`:'We deliver whole T&T ✈️ Same-day in POS, 1-2 days everywhere else. COD available. Yuh tracking code starts wid OD- — use di Track tab!'},
 {k:['size','fit'],f:()=>'True to size 💯 In between? Size up. DM yuh measurements an we help yuh pick.'},
 {k:['restock','sold out'],f:()=>{const o=CATALOG.find(p=>p.stock===0);return o?`Di ${o.name} coming back soon 👀 Drop yuh size an mi ping yuh first when it land.`:'Nothing sold out right now — full shelf!'}}
];
function sendChat(){
 const i=document.getElementById('chatMsg'),v=i.value.trim();if(!v)return;
 addB('u',esc(v));i.value='';
 const r=REPLIES.find(x=>x.k.some(k=>v.toLowerCase().includes(k)));
 setTimeout(()=>addB('b',r?r.f():'Lemme get di owner fah dat one — yuh go hear back in a bit 🙏'),500);
}
renderShop();
addB('b',BRAND.greeting);
</script>
</body>
</html>
